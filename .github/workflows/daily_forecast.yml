name: Daily Electricity Price Forecast

on:
  schedule:
    # 09:15 UTC ≈ 10:15 Berlin in winter — BEFORE 11:00 UTC gate
    - cron: "15 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Ensure dirs
        run: mkdir -p data/raw outputs/forecasts outputs/figures logs reports/metrics reports/figures

      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: |
            raw-data-

      - name: Daily forecast
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          python scripts/update_data.py
          python scripts/run_daily_forecast.py --no-update

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/ README.md reports/ || true
          git diff --staged --quiet || git commit -m "chore: daily forecast $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin main
